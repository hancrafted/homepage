frontmatter:
  rules:
    - ruleId: context
      path: [CONTEXT.md]
      intent: >-
        Stops CONTEXT.md going stale, since agents consume it constantly. It is
        vocabulary and nothing else — mechanism, rules and reasoning belong to the
        document that owns them.
      assess:
        stale: Tell the user this file is past its stale_after and ask whether to proceed. Offer to open an issue to refresh it, then set the next stale_after.
      fields:
        type: { presence: required, allowed: [{ value: memory }] }
        stale_after: { presence: required, format: datetime }
        generated.by:
          presence: required
          format: actor
          pattern: '^(?:[^:/ ]+/[^ ]+|process:[^ ]+)$'
          intent: >-
            An actor per Open Knowledge Format v0.2 section 7: an agent as
            <producer>/<version>, or process:<id> for the dispatcher and the gate.
            A generator is never human: here, so trust tiers stay readable.
        generated.at: { presence: required, format: datetime }
        verified.by:
          presence: optional
          format: actor
          pattern: '^human:[^ ]+$'
          intent: A verifier is a person, written human:<handle>
        verified.at: { presence: optional, format: datetime }
    - ruleId: steering
      path: [docs/steering/**/*.md]
      intent: 'Steering should rarely change, which is exactly why it has to be re-read on purpose'
      assess:
        stale: Tell the user this file is past its stale_after and ask whether to proceed. Offer to open an issue to refresh it, then set the next stale_after.
      fields:
        type: { presence: required, allowed: [{ value: steering }] }
        title: { presence: required, maxLength: 80 }
        description:
          presence: required
          maxLength: 300
          intent: >-
            Two sentences: what this document holds, then a trigger naming when
            to open it. An agent picks between steering documents on this alone,
            so it says when to read rather than summarising what is inside.
        stale_after: { presence: required, format: datetime }
        generated.by:
          presence: required
          format: actor
          pattern: '^(?:[^:/ ]+/[^ ]+|process:[^ ]+)$'
          intent: >-
            An actor per Open Knowledge Format v0.2 section 7: an agent as
            <producer>/<version>, or process:<id> for the dispatcher and the gate.
            A generator is never human: here, so trust tiers stay readable.
        generated.at: { presence: required, format: datetime }
        verified.by:
          presence: optional
          format: actor
          pattern: '^human:[^ ]+$'
          intent: A verifier is a person, written human:<handle>
        verified.at: { presence: optional, format: datetime }
    - ruleId: design-adr
      path: [docs/design-adr/**/*.md]
      intent: >-
        A design-ADR is a decision that outlives the code it was made about, so it
        has to say who wrote it. It carries no expiry: the reasoning behind a
        settled decision does not go stale on a date.
      fields:
        type: { presence: required, allowed: [{ value: design-adr }] }
        generated.by:
          presence: required
          format: actor
          pattern: '^(?:[^:/ ]+/[^ ]+|process:[^ ]+)$'
          intent: >-
            An actor per Open Knowledge Format v0.2 section 7: an agent as
            <producer>/<version>, or process:<id> for the dispatcher and the gate.
            A generator is never human: here, so trust tiers stay readable.
        generated.at: { presence: required, format: datetime }
        verified.by:
          presence: optional
          format: actor
          pattern: '^human:[^ ]+$'
          intent: A verifier is a person, written human:<handle>
        verified.at: { presence: optional, format: datetime }
    - ruleId: episode
      path: [docs/episodes/**/*.md]
      intent: >-
        An Episode is the primitive everything downstream is generated from, so the
        keys a generator reads — its Format, its Subject domains, whether it is still
        a draft — have to be present before anything reads them. Only the frontmatter
        half: the body's `###` headings are checked by whatever writes the Episode,
        reporting the two sides against each other by hand.
      assess:
        stale: Tell the user this Episode is past its stale_after and ask whether to proceed. The Publish bar's twelve-month shelf-life test is this date, so a stale Episode is a republish decision, not a refresh.
      fields:
        type: { presence: required, allowed: [{ value: Episode }] }
        title: { presence: required, maxLength: 80 }
        format:
          presence: required
          allowed: [{ value: Foundations }, { value: Teardown }]
          intent: >-
            The Format selects the Beats, so it is a field rather than a tag: a
            checker cannot resolve a skeleton out of free text. The body carries
            every Beat that Format requires, in the order it requires them.
        subject_domains:
          presence: required
          intent: >-
            The Subject domains the Episode shows the principle working in,
            kebab-case. This set equals the union of the body's `###` headings. A
            declared Subject domain no heading binds is reach the Episode did not
            show; a heading nobody declared is a case that arrived without anyone
            deciding to include it.
        description:
          presence: required
          maxLength: 1024
          intent: >-
            Two to three sentences in the third person: what the Episode teaches,
            the need that makes someone open it, and the terms a later run would
            search for. It is copied verbatim into an index and read with the
            Episode closed, so it names what the Episode is for and leaves the
            reader to infer the rest.
        thesis:
          presence: optional
          intent: >-
            The claim the Episode argues. Some passage in the body answers it, and
            the Beat that answers it can be named.
        analogy:
          presence: optional
          intent: >-
            The analogy the Episode is built on. It opens the first Beat and
            returns at every major turn, rather than appearing once and retiring.
        story_threads:
          presence: optional
          intent: >-
            Story Threads — A the idea, B the human stake. Each declared thread is
            traceable Beat by Beat and reaches a conclusion by the last Beat. A
            Beat a thread does not touch is fine; a point where the trace needs
            material the Episode does not carry is a gap.
        tags:
          presence: optional
          intent: >-
            What the Episode is about: the keyword half of discovery, beside the
            description. A tag names a subject, where a Subject domain names a
            field of practice the principle is shown working in.
        theory_hands_on_boundary:
          presence: optional
          intent: >-
            The Beat the turn from theory to hands-on falls after. That Beat exists
            in the Format, and the turn happens there rather than a Beat earlier or
            later.
        status:
          presence: required
          allowed: [{ value: draft }, { value: stable }]
          intent: >-
            Always written explicitly. An absent status reads as stable, so a first
            draft would claim to be finished.
        stale_after: { presence: required, format: datetime }
        generated.by:
          presence: required
          format: actor
          pattern: '^(?:[^:/ ]+/[^ ]+|process:[^ ]+)$'
          intent: >-
            An actor per Open Knowledge Format v0.2 section 7: an agent as
            <producer>/<version>, or process:<id> for the dispatcher and the gate.
            A generator is never human: here, so trust tiers stay readable.
        generated.at: { presence: required, format: datetime }
        verified.by:
          presence: optional
          format: actor
          pattern: '^human:[^ ]+$'
          intent: A verifier is a person, written human:<handle>
        verified.at: { presence: optional, format: datetime }
